<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LeetCode Enhancer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="popup__header">
        <h1>LeetCode Enhancer</h1>
        <span id="version" class="popup__badge"></span>
      </header>

      <label class="toggle" for="highlight">
        <input type="checkbox" id="highlight" />
        <span>
          <strong>Highlight injected changes</strong>
          <small>Green outlines mark community data replacing paywalls.</small>
        </span>
      </label>

      <p id="status" class="status" role="status">Normal extension look.</p>

      <label class="toggle toggle--spaced" for="auto-update">
        <input type="checkbox" id="auto-update" />
        <span>
          <strong>Auto-update company data</strong>
          <small>Checks this project's GitHub data branch once a day.</small>
        </span>
      </label>

      <div class="data-row">
        <p id="data" class="note">
          Community company data is bundled with the extension.
        </p>
        <button type="button" id="check" class="button">Check now</button>
      </div>
      <p id="update-status" class="status" role="status"></p>
      <p class="note">
        No telemetry. Updates download only public data files; nothing about you
        is sent.
      </p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
