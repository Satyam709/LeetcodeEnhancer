name: Sync data

# Rebuilds the artifacts from the source repo and publishes them to the orphan
# `data` branch (layout: v<schemaVersion>/…), which the extension's background
# updater reads through jsDelivr. GitHub only runs `schedule` from the default
# branch, so this activates once the workflow is on `main`.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Validates before writing; a failure writes nothing and fails the job.
      - name: Build artifacts
        run: pnpm data:sync --out out/v1

      - name: Check out the data branch
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch origin data:data
            git worktree add publish data
          else
            git worktree add --orphan -b data publish
          fi

      - name: Compare with the published snapshot
        id: diff
        run: pnpm exec tsx tools/sync-data/publish-diff.ts --prev publish/v1/meta.json --next out/v1/meta.json

      - name: Publish
        if: steps.diff.outputs.changed == 'true'
        working-directory: publish
        run: |
          mkdir -p v1
          rsync -a --delete ../out/v1/ v1/
          cat > README.md <<'EOF'
          # LeetCode Enhancer data

          Generated by `.github/workflows/sync-data.yml` from
          [liquidslr/leetcode-company-wise-problems](https://github.com/liquidslr/leetcode-company-wise-problems).
          Do not edit by hand. `v<N>/` holds artifacts for schema version N.
          EOF
          sha=$(node -p "require('./v1/meta.json').source.commitSha.slice(0, 12)")
          date=$(node -p "require('./v1/meta.json').source.commitDate")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "data: ${sha} (${date})"
          git push origin data

      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create data-sync --color d93f0b --description "Scheduled data sync" 2>/dev/null || true
          open=$(gh issue list --label data-sync --state open --json number --jq length)
          if [ "$open" = "0" ]; then
            gh issue create --label data-sync \
              --title "Data sync failed" \
              --body "The scheduled data sync failed: ${RUN_URL}. The extension keeps serving the last published snapshot."
          fi
